name: Verify Lean proofs

on:
  push:
    paths:
      - 'formalization/**'
      - 'docs/STATEMENTS.md'
      - '.github/workflows/verify-lean.yml'
  pull_request:
    paths:
      - 'formalization/**'
      - 'docs/STATEMENTS.md'
      - '.github/workflows/verify-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: formalization
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install the pinned Lean toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            --output "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Fetch the pinned mathlib cache
        run: lake exe cache get
      - name: Test correspondence validation
        run: python3 -m unittest discover -s tests -v
      - name: Build and audit every advertised declaration
        run: python3 verify.py
